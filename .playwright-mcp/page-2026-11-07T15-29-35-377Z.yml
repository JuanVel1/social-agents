    - heading "Qué herramienta hace cada paso del agente" [level=1] [ref=e5]
    - paragraph [ref=e6]: "El agente en Python orquesta todo. Lo autoalojado (Playwright, FFmpeg y Postiz) corre en tu servidor; Gemini, Notion, R2 y Meta son servicios externos en su capa gratuita. El cliente solo interviene en Notion: llena el formulario de onboarding (con su manual de marca en PDF) y aprueba las piezas."
  - img "Arquitectura open source del agente de redes El cliente llena el formulario de onboarding en Notion y sube su manual de marca en PDF; cada hora el agente se lo pasa a Gemini, que rellena los campos vacíos, y al aprobarse la fila genera el perfil de marca. Con esa marca el agente pide el copy a Gemini, renderiza las piezas con Playwright, edita los reels y sus subtítulos con FFmpeg y Whisper, las sube a Postiz que guarda los medios en Cloudflare R2, las envía a Notion para aprobación y, una vez aprobadas, Postiz las publica en Instagram y Facebook mediante la API de Meta, que descarga las imágenes desde R2." [ref=e8]:
