<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Quién hace qué en el ciclo mensual</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&family=Noto+Serif:ital@0;1&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Geist', system-ui, sans-serif; background: #f5f5f5; color: #2d3142; padding: 3rem 2rem; }
    @media (max-width: 640px) { body { padding: 2rem 1rem; } }
    .container { max-width: 1296px; margin: 0 auto; }
    .header { margin-bottom: 2rem; }
    .header-eyebrow { font-family: 'Geist Mono', monospace; font-size: 0.66rem; font-weight: 500; letter-spacing: 0.18em; text-transform: uppercase; color: #4f5d75; margin-bottom: 0.75rem; }
    h1 { font-family: 'Instrument Serif', 'Noto Serif', serif; font-size: clamp(1.75rem, 3vw + 1rem, 2.5rem); font-weight: 400; letter-spacing: -0.02em; line-height: 1.1; margin-bottom: 0.5rem; }
    .subtitle { font-size: 1rem; line-height: 1.55; color: #4f5d75; max-width: 62ch; }
    .diagram-container { overflow-x: auto; }
    svg { width: 100%; min-width: 1296px; display: block; }
    @media print { .diagram-container { overflow-x: visible; } svg { min-width: 0; } }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <p class="header-eyebrow">Ciclo mensual · Agente de redes sociales</p>
      <h1>Quién hace qué</h1>
      <p class="subtitle">El agente produce y publica. El cliente y la agencia intervienen solo donde Meta lo exige o donde la marca está en juego.</p>
    </div>

    <div class="diagram-container">
      <svg viewBox="0 0 1296 440" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="quien-hace-que-title quien-hace-que-desc">
        <title id="quien-hace-que-title">Quién hace qué en el ciclo mensual del agente</title>
        <desc id="quien-hace-que-desc">La agencia define la estrategia, el agente crea la parrilla, diseña, publica y redacta el informe, el cliente graba material y aprueba, y la agencia añade stickers y revisa el informe antes de volver a ajustar la parrilla.</desc>
        <defs>
          <marker id="qh-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
          <marker id="qh-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/></marker>
        </defs>

        <rect width="100%" height="100%" fill="#f5f5f5"/>

        <!-- Carriles -->
        <rect x="24" y="136" width="1256" height="96" fill="rgba(45,49,66,0.03)"/>
        <line x1="24" y1="40" x2="1280" y2="40" stroke="rgba(45,49,66,0.22)" stroke-width="1"/>
        <line x1="24" y1="136" x2="1280" y2="136" stroke="rgba(45,49,66,0.10)" stroke-width="1"/>
        <line x1="24" y1="232" x2="1280" y2="232" stroke="rgba(45,49,66,0.10)" stroke-width="1"/>
        <line x1="24" y1="328" x2="1280" y2="328" stroke="rgba(45,49,66,0.22)" stroke-width="1"/>
        <line x1="152" y1="40" x2="152" y2="328" stroke="rgba(45,49,66,0.22)" stroke-width="1"/>

        <text x="40" y="86" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" letter-spacing="0.18em">CLIENTE</text>
        <text x="40" y="100" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace">persona</text>
        <text x="40" y="182" fill="#2d3142" font-size="9" font-weight="600" font-family="'Geist Mono', monospace" letter-spacing="0.18em">AGENTE IA</text>
        <text x="40" y="196" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace">automático</text>
        <text x="40" y="278" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" letter-spacing="0.18em">AGENCIA</text>
        <text x="40" y="292" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace">persona</text>

        <!-- ===== Flechas (antes que los nodos) ===== -->
        <!-- A1 Estrategia → Parrilla -->
        <path d="M 304 280 H 364 Q 372 280 372 272 V 208" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#qh-arrow)"/>
        <!-- A2 Parrilla → Graba (solo Plan 2) -->
        <path d="M 464 172 H 548 Q 556 172 556 164 V 112" fill="none" stroke="#4f5d75" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#qh-arrow)"/>
        <!-- A3 Graba → Diseña y edita -->
        <path d="M 624 88 H 708 Q 716 88 716 96 V 160" fill="none" stroke="#4f5d75" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#qh-arrow)"/>
        <!-- A4 Parrilla → Diseña (Plan 1, sin grabación) -->
        <line x1="464" y1="196" x2="648" y2="196" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#qh-arrow)"/>
        <!-- A5 Diseña → Aprueba -->
        <path d="M 784 184 H 868 Q 876 184 876 176 V 112" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#qh-arrow)"/>
        <!-- A6 Aprueba → Publica (handoff clave) -->
        <path d="M 944 88 H 1028 Q 1036 88 1036 96 V 160" fill="none" stroke="#eb6c36" stroke-width="1.4" marker-end="url(#qh-arrow-accent)"/>
        <!-- A7 Publica → Informe -->
        <line x1="1104" y1="184" x2="1128" y2="184" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#qh-arrow)"/>
        <!-- A8 Publica → Stickers -->
        <line x1="1036" y1="208" x2="1036" y2="256" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#qh-arrow)"/>
        <!-- A9 Informe → Revisa -->
        <line x1="1196" y1="208" x2="1196" y2="256" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#qh-arrow)"/>
        <!-- A10 Revisa → Parrilla (ajustes del ciclo) -->
        <path d="M 1196 304 V 332 Q 1196 340 1188 340 H 428 Q 420 340 420 332 V 208" fill="none" stroke="#4f5d75" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#qh-arrow)"/>

        <!-- Etiquetas -->
        <rect x="566" y="118" width="52" height="12" rx="2" fill="#f5f5f5"/>
        <text x="592" y="127" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">GUIONES</text>

        <rect x="726" y="118" width="56" height="12" rx="2" fill="#f5f5f5"/>
        <text x="754" y="127" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">MATERIAL</text>

        <rect x="512" y="204" width="88" height="12" rx="2" fill="#efeff0"/>
        <text x="556" y="213" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">SIN GRABACIÓN</text>

        <rect x="886" y="118" width="56" height="12" rx="2" fill="#f5f5f5"/>
        <text x="914" y="127" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">REVISIÓN</text>

        <rect x="1046" y="118" width="60" height="12" rx="2" fill="#f5f5f5"/>
        <text x="1076" y="127" fill="#eb6c36" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">APROBADO</text>

        <rect x="984" y="240" width="42" height="12" rx="2" fill="#f5f5f5"/>
        <text x="1005" y="249" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">AVISO</text>

        <rect x="1130" y="240" width="56" height="12" rx="2" fill="#f5f5f5"/>
        <text x="1158" y="249" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">BORRADOR</text>

        <rect x="772" y="348" width="128" height="12" rx="2" fill="#f5f5f5"/>
        <text x="836" y="357" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">AJUSTES · SIGUIENTE MES</text>

        <!-- ===== Nodos ===== -->
        <!-- Agencia: Define estrategia -->
        <rect x="168" y="256" width="136" height="48" rx="6" fill="#f5f5f5"/>
        <rect x="168" y="256" width="136" height="48" rx="6" fill="rgba(79,93,117,0.10)" stroke="#7a8399" stroke-width="1"/>
        <text x="236" y="277" fill="#2d3142" font-size="11" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Define estrategia</text>
        <text x="236" y="292" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">pilares · tono · trimestral</text>

        <!-- Agente: Parrilla y guiones -->
        <rect x="328" y="160" width="136" height="48" rx="6" fill="#f5f5f5"/>
        <rect x="328" y="160" width="136" height="48" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="396" y="181" fill="#2d3142" font-size="11" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Parrilla y guiones</text>
        <text x="396" y="196" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">Claude</text>

        <!-- Cliente: Graba material (solo Plan 2) -->
        <rect x="488" y="64" width="136" height="48" rx="6" fill="#f5f5f5"/>
        <rect x="488" y="64" width="136" height="48" rx="6" fill="rgba(79,93,117,0.10)" stroke="#7a8399" stroke-width="1" stroke-dasharray="4,3"/>
        <text x="556" y="85" fill="#2d3142" font-size="11" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Graba material</text>
        <text x="556" y="100" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">solo Plan 2 · 1 sesión</text>

        <!-- Agente: Diseña y edita -->
        <rect x="648" y="160" width="136" height="48" rx="6" fill="#f5f5f5"/>
        <rect x="648" y="160" width="136" height="48" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="716" y="181" fill="#2d3142" font-size="11" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Diseña y edita</text>
        <text x="716" y="196" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">Canva · Descript</text>

        <!-- Cliente: Aprueba parrilla (focal) -->
        <rect x="808" y="64" width="136" height="48" rx="6" fill="#f5f5f5"/>
        <rect x="808" y="64" width="136" height="48" rx="6" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1"/>
        <text x="876" y="85" fill="#2d3142" font-size="11" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Aprueba parrilla</text>
        <text x="876" y="100" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">tablero Notion</text>

        <!-- Agente: Programa y publica -->
        <rect x="968" y="160" width="136" height="48" rx="6" fill="#f5f5f5"/>
        <rect x="968" y="160" width="136" height="48" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="1036" y="181" fill="#2d3142" font-size="11" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Programa y publica</text>
        <text x="1036" y="196" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">Blotato → IG + FB</text>

        <!-- Agente: Redacta informe -->
        <rect x="1128" y="160" width="136" height="48" rx="6" fill="#f5f5f5"/>
        <rect x="1128" y="160" width="136" height="48" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="1196" y="181" fill="#2d3142" font-size="11" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Redacta informe</text>
        <text x="1196" y="196" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">métricas · quincenal</text>

        <!-- Agencia: Stickers y audio -->
        <rect x="968" y="256" width="136" height="48" rx="6" fill="#f5f5f5"/>
        <rect x="968" y="256" width="136" height="48" rx="6" fill="rgba(79,93,117,0.10)" stroke="#7a8399" stroke-width="1"/>
        <text x="1036" y="277" fill="#2d3142" font-size="11" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Stickers y audio</text>
        <text x="1036" y="292" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">en la app de Instagram</text>

        <!-- Agencia: Revisa informe -->
        <rect x="1128" y="256" width="136" height="48" rx="6" fill="#f5f5f5"/>
        <rect x="1128" y="256" width="136" height="48" rx="6" fill="rgba(79,93,117,0.10)" stroke="#7a8399" stroke-width="1"/>
        <text x="1196" y="277" fill="#2d3142" font-size="11" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Revisa informe</text>
        <text x="1196" y="292" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">y reunión con cliente</text>

        <!-- Leyenda -->
        <line x1="24" y1="376" x2="1280" y2="376" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
        <text x="24" y="396" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.18em">LEYENDA</text>

        <rect x="24" y="412" width="24" height="12" rx="2" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="56" y="422" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Paso automático del agente</text>

        <rect x="212" y="412" width="24" height="12" rx="2" fill="rgba(79,93,117,0.10)" stroke="#7a8399" stroke-width="1"/>
        <text x="244" y="422" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Paso humano (human-in-the-loop)</text>

        <rect x="420" y="412" width="24" height="12" rx="2" fill="rgba(79,93,117,0.10)" stroke="#7a8399" stroke-width="1" stroke-dasharray="4,3"/>
        <text x="452" y="422" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Solo Plan 2</text>

        <rect x="548" y="412" width="24" height="12" rx="2" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1"/>
        <text x="580" y="422" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Control antes de publicar</text>

        <line x1="736" y1="418" x2="764" y2="418" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#qh-arrow)"/>
        <text x="772" y="422" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Flujo</text>

        <line x1="836" y1="418" x2="864" y2="418" stroke="#4f5d75" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#qh-arrow)"/>
        <text x="872" y="422" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Opcional o retorno</text>
      </svg>
    </div>
  </div>
</body>
</html>
