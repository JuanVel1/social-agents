<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Costo del LLM por cliente</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&family=Noto+Serif:ital@0;1&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Geist', system-ui, sans-serif; background: #f5f5f5; color: #2d3142; padding: 3rem 2rem; }
    @media (max-width: 640px) { body { padding: 2rem 1rem; } }
    .container { max-width: 1000px; margin: 0 auto; }
    .header { margin-bottom: 2rem; }
    .header-eyebrow { font-family: 'Geist Mono', monospace; font-size: 0.66rem; font-weight: 500; letter-spacing: 0.18em; text-transform: uppercase; color: #4f5d75; margin-bottom: 0.75rem; }
    h1 { font-family: 'Instrument Serif', 'Noto Serif', serif; font-size: clamp(1.75rem, 3vw + 1rem, 2.5rem); font-weight: 400; letter-spacing: -0.02em; line-height: 1.1; margin-bottom: 0.5rem; }
    .subtitle { font-size: 1rem; line-height: 1.55; color: #4f5d75; max-width: 62ch; }
    .diagram-container { overflow-x: auto; }
    svg { width: 100%; min-width: 1000px; display: block; }
    @media print { .diagram-container { overflow-x: visible; } svg { min-width: 0; } }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <p class="header-eyebrow">Comparativa de LLM · octubre 2026</p>
      <h1>Costo del LLM por cliente al mes</h1>
      <p class="subtitle">Misma carga para todos: 4 millones de tokens de entrada y 0,6 millones de salida por cliente al mes, a precio de lista sin caché ni lotes.</p>
    </div>
    <div class="diagram-container">
      <svg viewBox="0 0 1000 500" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="costo-llm-title costo-llm-desc">
        <title id="costo-llm-title">Costo del LLM por cliente al mes</title>
        <desc id="costo-llm-desc">Barras horizontales con el costo mensual por cliente de ocho opciones de modelo, desde 15,20 dólares con Gemini 3.1 Pro hasta 0,70 con Claude Haiku 5.5; la mezcla recomendada de Sonnet y Haiku cuesta 6,02.</desc>

        <rect width="100%" height="100%" fill="#f5f5f5"/>

        <!-- Gridlines verticales: 0, 4, 8, 12, 16 USD (x = 220 + v × 46,25) -->
        <line x1="405" y1="40" x2="405" y2="400" stroke="rgba(45,49,66,0.08)" stroke-width="0.8"/>
        <line x1="590" y1="40" x2="590" y2="400" stroke="rgba(45,49,66,0.08)" stroke-width="0.8"/>
        <line x1="775" y1="40" x2="775" y2="400" stroke="rgba(45,49,66,0.08)" stroke-width="0.8"/>
        <line x1="960" y1="40" x2="960" y2="400" stroke="rgba(45,49,66,0.08)" stroke-width="0.8"/>
        <line x1="220" y1="40" x2="220" y2="400" stroke="rgba(45,49,66,0.25)" stroke-width="1"/>

        <text x="220" y="420" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">$0</text>
        <text x="405" y="420" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">$4</text>
        <text x="590" y="420" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">$8</text>
        <text x="775" y="420" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">$12</text>
        <text x="960" y="420" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">$16</text>
        <text x="590" y="436" fill="#4f5d75" font-size="7" font-family="'Geist Mono', monospace" letter-spacing="0.14em" text-anchor="middle">USD POR CLIENTE AL MES</text>

        <!-- Barras: centros 64 + 44k, alto 28 -->
        <!-- Gemini 3.1 Pro 15,20 → 703 px -->
        <rect x="220" y="50" width="703" height="28" fill="#f5f5f5"/>
        <rect x="220" y="50" width="703" height="28" fill="rgba(79,93,117,0.15)" stroke="#4f5d75" stroke-width="1"/>
        <text x="931" y="67" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace">15,20</text>
        <text x="208" y="62" fill="#2d3142" font-size="11" font-weight="600" font-family="'Geist', sans-serif" text-anchor="end">Gemini 3.1 Pro</text>
        <text x="208" y="74" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="end">Google · $2 / $12</text>

        <!-- Claude Sonnet 5.5 14,00 → 648 -->
        <rect x="220" y="94" width="648" height="28" fill="#f5f5f5"/>
        <rect x="220" y="94" width="648" height="28" fill="rgba(79,93,117,0.15)" stroke="#4f5d75" stroke-width="1"/>
        <text x="876" y="111" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace">14,00</text>
        <text x="208" y="106" fill="#2d3142" font-size="11" font-weight="600" font-family="'Geist', sans-serif" text-anchor="end">Claude Sonnet 5.5</text>
        <text x="208" y="118" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="end">Anthropic · $2 / $10</text>

        <!-- DeepSeek V4 Pro 7,66 → 354 -->
        <rect x="220" y="138" width="354" height="28" fill="#f5f5f5"/>
        <rect x="220" y="138" width="354" height="28" fill="rgba(79,93,117,0.15)" stroke="#4f5d75" stroke-width="1"/>
        <text x="582" y="155" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace">7,66</text>
        <text x="208" y="150" fill="#2d3142" font-size="11" font-weight="600" font-family="'Geist', sans-serif" text-anchor="end">DeepSeek V4 Pro</text>
        <text x="208" y="162" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="end">DeepSeek · $1,32 / $3,96</text>

        <!-- Mezcla Sonnet + Haiku 6,02 → 278 (focal) -->
        <rect x="220" y="182" width="278" height="28" fill="#f5f5f5"/>
        <rect x="220" y="182" width="278" height="28" fill="rgba(235,108,54,0.12)" stroke="#eb6c36" stroke-width="1"/>
        <text x="506" y="199" fill="#eb6c36" font-size="8" font-weight="600" font-family="'Geist Mono', monospace">6,02</text>
        <text x="208" y="194" fill="#2d3142" font-size="11" font-weight="600" font-family="'Geist', sans-serif" text-anchor="end">Sonnet + Haiku</text>
        <text x="208" y="206" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="end">40 % / 60 % del trabajo</text>

        <!-- Gemini 3 Flash 3,80 → 176 -->
        <rect x="220" y="226" width="176" height="28" fill="#f5f5f5"/>
        <rect x="220" y="226" width="176" height="28" fill="rgba(79,93,117,0.15)" stroke="#4f5d75" stroke-width="1"/>
        <text x="404" y="243" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace">3,80</text>
        <text x="208" y="238" fill="#2d3142" font-size="11" font-weight="600" font-family="'Geist', sans-serif" text-anchor="end">Gemini 3 Flash</text>
        <text x="208" y="250" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="end">Google · $0,50 / $3</text>

        <!-- GPT-5 mini 2,20 → 102 -->
        <rect x="220" y="270" width="102" height="28" fill="#f5f5f5"/>
        <rect x="220" y="270" width="102" height="28" fill="rgba(79,93,117,0.15)" stroke="#4f5d75" stroke-width="1"/>
        <text x="330" y="287" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace">2,20</text>
        <text x="208" y="282" fill="#2d3142" font-size="11" font-weight="600" font-family="'Geist', sans-serif" text-anchor="end">GPT-5 mini</text>
        <text x="208" y="294" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="end">OpenAI · $0,25 / $2</text>

        <!-- DeepSeek V4.1 Flash 1,92 → 89 -->
        <rect x="220" y="314" width="89" height="28" fill="#f5f5f5"/>
        <rect x="220" y="314" width="89" height="28" fill="rgba(79,93,117,0.15)" stroke="#4f5d75" stroke-width="1"/>
        <text x="317" y="331" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace">1,92</text>
        <text x="208" y="326" fill="#2d3142" font-size="11" font-weight="600" font-family="'Geist', sans-serif" text-anchor="end">DeepSeek V4.1 Flash</text>
        <text x="208" y="338" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="end">DeepSeek · $0,30 / $1,20</text>

        <!-- Claude Haiku 5.5 0,70 → 32 -->
        <rect x="220" y="358" width="32" height="28" fill="#f5f5f5"/>
        <rect x="220" y="358" width="32" height="28" fill="rgba(79,93,117,0.15)" stroke="#4f5d75" stroke-width="1"/>
        <text x="260" y="375" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace">0,70</text>
        <text x="208" y="370" fill="#2d3142" font-size="11" font-weight="600" font-family="'Geist', sans-serif" text-anchor="end">Claude Haiku 5.5</text>
        <text x="208" y="382" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="end">Anthropic · $0,10 / $0,50</text>

        <!-- Leyenda -->
        <line x1="40" y1="456" x2="960" y2="456" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
        <rect x="40" y="474" width="24" height="10" rx="2" fill="rgba(235,108,54,0.12)" stroke="#eb6c36" stroke-width="1"/>
        <text x="72" y="483" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Opción recomendada</text>
        <rect x="200" y="474" width="24" height="10" rx="2" fill="rgba(79,93,117,0.15)" stroke="#4f5d75" stroke-width="1"/>
        <text x="232" y="483" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Un solo modelo para todo</text>
        <text x="960" y="483" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="end">precio entrada / salida por millón de tokens · orden por costo</text>
      </svg>
    </div>
  </div>
</body>
</html>
