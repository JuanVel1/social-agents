[project]
name = "social-agent"
version = "0.1.0"
description = "Agente de redes sociales: parrilla, diseño, aprobación en Notion y publicación con Postiz"
requires-python = ">=3.11"
dependencies = [
    "google-genai>=1.0",
    "pydantic>=2.7",
    "pyyaml>=6.0",
    "jinja2>=3.1",
    "playwright>=1.45",
    "httpx>=0.27",
    "apscheduler>=3.10,<4",
    "python-dotenv>=1.0",
]

[project.scripts]
social-agent = "social_agent.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/social_agent"]

[tool.pytest.ini_options]
testpaths = ["tests"]
